name: GQA Synthetic Large-History Query Benchmark

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'db-migrate/**'
      - 'scripts/history_query_benchmark.sql'
      - '.github/workflows/history-query-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'db-migrate/**'
      - 'scripts/history_query_benchmark.sql'
      - '.github/workflows/history-query-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start disposable PostgreSQL (no host port exposed)
        run: |
          docker run -d --name gqa-synthetic-benchmark-db \
            -e POSTGRES_PASSWORD="$(openssl rand -hex 32)" \
            postgres:16-alpine
          ready=false
          for i in $(seq 1 60); do
            # Postgres briefly accepts connections during initdb before its
            # final restart; pg_isready alone can pass during that window.
            if docker logs gqa-synthetic-benchmark-db 2>&1 | grep -Fq 'PostgreSQL init process complete; ready for start up.' && \
               docker exec gqa-synthetic-benchmark-db pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
      - name: Apply current v0.13 baseline schema to disposable database
        run: |
          docker exec -i gqa-synthetic-benchmark-db psql -X -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < db-migrate/versions/0001_baseline.sql
      - name: Capture first-page and deep-page SQL plans for 100k synthetic rows
        run: |
          set -o pipefail
          docker exec -i gqa-synthetic-benchmark-db psql -X -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < scripts/history_query_benchmark.sql \
            | tee gqa-history-before-indexes.txt
          grep -q 'plans deep page' gqa-history-before-indexes.txt
          grep -q 'runs deep page' gqa-history-before-indexes.txt
          grep -q 'browser flows deep page' gqa-history-before-indexes.txt
          grep -q 'Execution Time' gqa-history-before-indexes.txt
      - name: Apply migration 0002 against same dataset (transactional upgrade rehearsal)
        run: |
          docker exec -i gqa-synthetic-benchmark-db psql -X -U postgres -d postgres \
            --single-transaction -v ON_ERROR_STOP=1 < db-migrate/versions/0002_history_keyset_indexes.sql
          test "$(docker exec gqa-synthetic-benchmark-db psql -U postgres -d postgres -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname IN ('plans_project_created_id','test_runs_project_started_id','browser_flows_project_created_id','memories_project_created_id')")" = 4
      - name: Capture after-index plans on identical 100k-row dataset
        run: |
          set -o pipefail
          docker exec -i gqa-synthetic-benchmark-db psql -X -U postgres -d postgres \
            -v ON_ERROR_STOP=1 < scripts/history_query_explain.sql \
            | tee gqa-history-after-indexes.txt
          grep -q 'plans deep page' gqa-history-after-indexes.txt
          grep -q 'runs deep page' gqa-history-after-indexes.txt
          grep -q 'browser flows deep page' gqa-history-after-indexes.txt
          grep -q 'Execution Time' gqa-history-after-indexes.txt
      - name: Upload measured query plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gqa-history-query-plans
          path: |
            gqa-history-before-indexes.txt
            gqa-history-after-indexes.txt
          if-no-files-found: error
          retention-days: 14
      - name: Disposable database diagnostics
        if: failure()
        run: docker logs --tail 120 gqa-synthetic-benchmark-db || true
      - name: Tear down synthetic PostgreSQL and discard its contents
        if: always()
        run: docker rm -f gqa-synthetic-benchmark-db || true
