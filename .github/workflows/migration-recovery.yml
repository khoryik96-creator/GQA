name: GQA Database Migration Upgrade & Recovery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate isolated database credentials
        run: |
          printf 'GQA_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 32)" > .env
          printf 'GQA_RUNNER_TOKEN=%s\n' "$(openssl rand -hex 32)" >> .env
          printf 'GQA_DB_APP_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> .env
          printf 'GQA_DB_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> .env

      - name: Preseed v0.13 schema and a persistent record before the version ledger exists
        run: |
          docker compose up -d --wait db
          docker compose exec -T db psql -U gqa -d gqa -v ON_ERROR_STOP=1 < apps/api/schema.sql
          docker compose exec -T db psql -U gqa -d gqa -v ON_ERROR_STOP=1 -c "
            INSERT INTO projects(name,repo_url,app_type,stack)
            VALUES ('GQA legacy sentinel','https://github.com/khoryik96-creator/GQA','web','pre-versioned');"
          test "$(docker compose exec -T db psql -U gqa -d gqa -Atc "SELECT count(*) FROM projects WHERE name='GQA legacy sentinel'")" = "1"
          test "$(docker compose exec -T db psql -U gqa -d gqa -Atc "SELECT to_regclass('public.gqa_schema_migrations') IS NULL")" = "t"

      - name: Upgrade legacy schema and verify existing records survive
        run: |
          docker compose run --rm migrate
          expected="$(sha256sum db-migrate/versions/0001_baseline.sql | cut -d ' ' -f1)"
          recorded="$(docker compose exec -T db psql -U gqa -d gqa -Atc 'SELECT checksum FROM public.gqa_schema_migrations WHERE version=1')"
          test "$expected" = "$recorded"
          expected_v2="$(sha256sum db-migrate/versions/0002_history_keyset_indexes.sql | cut -d ' ' -f1)"
          recorded_v2="$(docker compose exec -T db psql -U gqa -d gqa -Atc 'SELECT checksum FROM public.gqa_schema_migrations WHERE version=2')"
          test "$expected_v2" = "$recorded_v2"
          expected_v3="$(sha256sum db-migrate/versions/0003_immutable_flow_revisions.sql | cut -d ' ' -f1)"
          recorded_v3="$(docker compose exec -T db psql -U gqa -d gqa -Atc 'SELECT checksum FROM public.gqa_schema_migrations WHERE version=3')"
          test "$expected_v3" = "$recorded_v3"
          expected_v4="$(sha256sum db-migrate/versions/0004_qa_activity_audit.sql | cut -d ' ' -f1)"
          recorded_v4="$(docker compose exec -T db psql -U gqa -d gqa -Atc 'SELECT checksum FROM public.gqa_schema_migrations WHERE version=4')"
          test "$expected_v4" = "$recorded_v4"
          expected_v5="$(sha256sum db-migrate/versions/0005_code_reviews.sql | cut -d ' ' -f1)"
          recorded_v5="$(docker compose exec -T db psql -U gqa -d gqa -Atc 'SELECT checksum FROM public.gqa_schema_migrations WHERE version=5')"
          test "$expected_v5" = "$recorded_v5"
          expected_v6="$(sha256sum db-migrate/versions/0006_ai_provider_settings.sql | cut -d ' ' -f1)"
          recorded_v6="$(docker compose exec -T db psql -U gqa -d gqa -Atc 'SELECT checksum FROM public.gqa_schema_migrations WHERE version=6')"
          test "$expected_v6" = "$recorded_v6"
          test "$(docker compose exec -T db psql -U gqa -d gqa -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname IN ('code_reviews_project_date','code_reviews_one_running')")" = "2"
          test "$(docker compose exec -T db psql -U gqa -d gqa -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname='qa_activity_project_date'")" = "1"
          test "$(docker compose exec -T db psql -U gqa -d gqa -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname='browser_flow_one_revision_per_source'")" = "1"
          test "$(docker compose exec -T db psql -U gqa -d gqa -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname IN ('plans_project_created_id','test_runs_project_started_id','browser_flows_project_created_id','memories_project_created_id')")" = "4"
          test "$(docker compose exec -T db psql -U gqa -d gqa -Atc "SELECT count(*) FROM projects WHERE name='GQA legacy sentinel'")" = "1"
          docker compose run --rm migrate
          test "$(docker compose exec -T db psql -U gqa -d gqa -Atc 'SELECT count(*) FROM public.gqa_schema_migrations')" = "6"

      - name: Rehearse custom-format backup and transactional restore into a separate disposable database
        run: |
          set -euo pipefail
          # Add linked records after the legacy schema was upgraded.
          docker compose exec -T db psql -U gqa -d gqa -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO qa_requests(project_id,prompt,environment)
          SELECT id,'GQA disposable backup verification','local'
          FROM projects WHERE name='GQA legacy sentinel';
          INSERT INTO plans(project_id,request_id,selected_agents,warnings)
          SELECT project_id,id,'[]'::jsonb,'[]'::jsonb
          FROM qa_requests WHERE prompt='GQA disposable backup verification';
          INSERT INTO test_runs(project_id,plan_id,target_url,status)
          SELECT project_id,id,'http://fixture:8081','passed'
          FROM plans WHERE request_id IN
            (SELECT id FROM qa_requests WHERE prompt='GQA disposable backup verification');
          INSERT INTO browser_flows(project_id,plan_id,prompt,objective,steps,digest,generation_mode)
          SELECT project_id,id,'GQA disposable browser backup fixture',
            'Verify restored browser flow','[]'::jsonb,repeat('a',64),'rules'
          FROM plans WHERE request_id IN
            (SELECT id FROM qa_requests WHERE prompt='GQA disposable backup verification');
          INSERT INTO memories(project_id,kind,content)
          SELECT id,'requirement','GQA restore sentinel memory'
          FROM projects WHERE name='GQA legacy sentinel';
          SQL
          backup="$(mktemp /tmp/gqa-ci-backup.XXXXXX.dump)"
          trap 'rm -f "$backup"' EXIT
          docker compose exec -T db pg_dump -U gqa -d gqa --format=custom --no-owner > "$backup"
          test "$(wc -c < "$backup")" -gt 10000
          echo "Synthetic dump SHA256: $(sha256sum "$backup" | cut -d ' ' -f1)"
          docker compose exec -T db createdb -U gqa --template=template0 gqa_recovered
          docker compose exec -T db pg_restore -U gqa -d gqa_recovered \
            --no-owner --single-transaction --exit-on-error < "$backup"
          for table in projects qa_requests plans test_runs browser_flows memories qa_activity_audit gqa_schema_migrations; do
            source_rows="$(docker compose exec -T db psql -U gqa -d gqa -Atc "SELECT count(*) FROM $table")"
            restore_rows="$(docker compose exec -T db psql -U gqa -d gqa_recovered -Atc "SELECT count(*) FROM $table")"
            test "$source_rows" = "$restore_rows"
            test "$restore_rows" -ge 1
          done
          expected_v3_restore="$(docker compose exec -T db psql -U gqa -d gqa -Atc "SELECT checksum FROM gqa_schema_migrations WHERE version=3")"
          restored_v3="$(docker compose exec -T db psql -U gqa -d gqa_recovered -Atc "SELECT checksum FROM gqa_schema_migrations WHERE version=3")"
          test "$expected_v3_restore" = "$restored_v3"
          expected_v4_restore="$(docker compose exec -T db psql -U gqa -d gqa -Atc "SELECT checksum FROM gqa_schema_migrations WHERE version=4")"
          restored_v4="$(docker compose exec -T db psql -U gqa -d gqa_recovered -Atc "SELECT checksum FROM gqa_schema_migrations WHERE version=4")"
          test "$expected_v4_restore" = "$restored_v4"
          test "$(docker compose exec -T db psql -U gqa -d gqa_recovered -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname='browser_flow_one_revision_per_source'")" = "1"
          expected="$(docker compose exec -T db psql -U gqa -d gqa -Atc "SELECT checksum FROM gqa_schema_migrations WHERE version=2")"
          restored="$(docker compose exec -T db psql -U gqa -d gqa_recovered -Atc "SELECT checksum FROM gqa_schema_migrations WHERE version=2")"
          test "$expected" = "$restored"
          test "$(docker compose exec -T db psql -U gqa -d gqa_recovered -Atc "SELECT count(*) FROM projects WHERE name='GQA legacy sentinel'")" = "1"
          test "$(docker compose exec -T db psql -U gqa -d gqa_recovered -Atc "SELECT count(*) FROM memories WHERE content='GQA restore sentinel memory'")" = "1"
          test "$(docker compose exec -T db psql -U gqa -d gqa_recovered -Atc "SELECT has_table_privilege('gqa_app','public.projects','SELECT')")" = "t"
          test "$(docker compose exec -T db psql -U gqa -d gqa_recovered -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexname IN ('plans_project_created_id','test_runs_project_started_id','browser_flows_project_created_id','memories_project_created_id')")" = "4"
          docker compose exec -T db dropdb -U gqa gqa_recovered
          echo "PASS: custom-format backup and transactional restore preserved seven linked tables, migration checksums, indexes, and app reader grant"

      - name: Reject modified history without changing application data
        run: |
          original="$(docker compose exec -T db psql -U gqa -d gqa -Atc 'SELECT checksum FROM public.gqa_schema_migrations WHERE version=1')"
          docker compose exec -T db psql -U gqa -d gqa -v ON_ERROR_STOP=1 -c "
            UPDATE public.gqa_schema_migrations SET checksum=repeat('a',64) WHERE version=1;"
          if docker compose run --rm migrate; then
            echo "FAIL: modified history was accepted" >&2
            exit 1
          fi
          test "$(docker compose exec -T db psql -U gqa -d gqa -Atc "SELECT count(*) FROM projects WHERE name='GQA legacy sentinel'")" = "1"
          docker compose exec -T db psql -U gqa -d gqa -v ON_ERROR_STOP=1 -c "
            UPDATE public.gqa_schema_migrations SET checksum='$original' WHERE version=1;"
          docker compose run --rm migrate

      - name: Reject a database from a newer schema version
        run: |
          docker compose exec -T db psql -U gqa -d gqa -v ON_ERROR_STOP=1 -c "
            INSERT INTO public.gqa_schema_migrations(version,checksum) VALUES (999,repeat('b',64));"
          if docker compose run --rm migrate; then
            echo "FAIL: newer database version was accepted" >&2
            exit 1
          fi
          test "$(docker compose exec -T db psql -U gqa -d gqa -Atc "SELECT count(*) FROM projects WHERE name='GQA legacy sentinel'")" = "1"
          echo "PASS: old data preserved and invalid migration history rejected"

      - name: Diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail 100 db migrate || true

      - name: Clean up isolated CI volumes
        if: always()
        run: |
          docker compose down -v || true
          rm -f .env
