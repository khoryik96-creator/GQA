name: GQA Browser UI E2E and Accessibility Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate isolated CI secrets
        run: |
          printf 'GQA_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 32)" > .env
          printf 'GQA_RUNNER_TOKEN=%s\n' "$(openssl rand -hex 32)" >> .env
          printf 'GQA_DB_APP_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> .env
          printf 'GQA_DB_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> .env
      - name: Start local-only application and QA fixtures
        run: docker compose up --build -d
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install locked browser automation dependencies and Chromium
        working-directory: apps/runner
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run real browser login, project, memory and keyboard journeys
        working-directory: apps/runner
        env:
          GQA_UI_E2E_ISOLATED: "YES"
        run: |
          set -euo pipefail
          export GQA_UI_TEST_ADMIN_PASSWORD="$(sed -n 's/^GQA_ADMIN_PASSWORD=//p' ../../.env)"
          node tests/ui_e2e.mjs
          node tests/advanced_ui_e2e.mjs
          node tests/repair_review_ui_e2e.mjs
          node tests/typed_flow_revision_e2e.mjs
          node tests/wcag_axe_audit.mjs
      - name: Upload WCAG screening report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gqa-wcag-axe-screen
          path: apps/runner/ui-e2e-artifacts/wcag-axe-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gqa-ui-e2e-diagnostics
          path: apps/runner/ui-e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Diagnose failing CI stack
        if: failure()
        run: docker compose logs --no-color --tail 120 api web db || true
      - name: Destroy disposable CI volumes and secrets
        if: always()
        run: |
          docker compose down -v || true
          rm -f .env
