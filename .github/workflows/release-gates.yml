name: GQA Release Candidate Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check safe defaults and release documentation
        run: node scripts/release-gates.mjs
      - name: Prevent tracked developer secrets and runtime job journals
        run: |
          if git ls-files | grep -E '(^|/)(\.env$|jobs\.json$|gqa_session$|.*\.pem$|.*\.key$)'; then
            echo "Tracked secret or local runtime state detected"
            exit 1
          fi
          echo "No known local secret file types tracked"
      - name: Check whitespace errors in changed source
        run: git diff --check HEAD^ HEAD
